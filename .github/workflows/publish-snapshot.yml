# Publica el SNAPSHOT de dynamia-tools en los GitHub Packages de este mismo repo (público,
# https://maven.pkg.github.com/dynamiatools/framework) cada vez que cambia `next`.
# dynamia-erp lo resuelve desde ahí (dynamiatools.version = *-SNAPSHOT).
# No publica en Maven Central: eso sigue siendo release.yml.
# Solo publica versiones -SNAPSHOT: una versión de release (26.10.3) no se puede sobrescribir en GitHub
# Packages (HTTP 409) y su publicación es de release.yml.

name: Publish Snapshot

on:
  push:
    branches: [ next ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'platform/packages/**'
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        architecture: x64
        distribution: temurin
        cache: maven
        server-id: github
        server-username-env-var: MAVEN_USERNAME
        server-password-env-var: MAVEN_PASSWORD

    - name: Read project version
      id: version
      run: |
        version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        case "$version" in
          *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "::notice::Version $version is not a SNAPSHOT, nothing to publish" ;;
        esac

    - name: Verify and deploy SNAPSHOT
      if: steps.version.outputs.snapshot == 'true'
      # Se invoca deploy:deploy directo porque central-publishing-maven-plugin (extensions=true)
      # reemplaza la fase deploy del ciclo de vida y publicaría en Central.
      run: >
        mvn -B -T 1C verify
        org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy
        -DaltDeploymentRepository=github::https://maven.pkg.github.com/dynamiatools/framework
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
