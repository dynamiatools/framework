# Verificación de PR: compila y corre los tests. Se salta en borradores
# (se ejecuta al marcar el PR como "Ready for review") y cancela ejecuciones obsoletas.
# También corre en cada push a next y main: setup-java guarda la caché de Maven de la rama, y los PR, los releases (que
# corren sobre un tag) y los demás workflows solo pueden leer la de su propio ref y la de la rama por defecto (main).
# Sin este push, main nunca tenía caché y publish-snapshot (que no compila cuando la versión no es SNAPSHOT) solo
# guardaba una de 10 MB, así que cada ejecución bajaba todas las dependencias.

name: Maven Build

on:
  push:
    branches: [ next, main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'platform/packages/**'
  pull_request:
    branches: [ next, main ]
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'platform/packages/**'

concurrency:
  group: maven-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        architecture: x64
        distribution: temurin
        cache: maven
    - name: Build with Maven
      run: mvn -B -T 1C verify --file pom.xml
