# Verificación de PR: compila y corre los tests. Se salta en borradores
# (se ejecuta al marcar el PR como "Ready for review") y cancela ejecuciones obsoletas.

name: Maven Build

on:
  pull_request:
    branches: [ next, main ]
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'platform/packages/**'

concurrency:
  group: maven-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: 25
        architecture: x64
        distribution: temurin
        cache: maven
    - name: Build with Maven
      run: mvn -B -e -DskipTests -pl platform/core/commons -am verify --file pom.xml
