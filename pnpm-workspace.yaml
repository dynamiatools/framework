packages:
  # Core platform packages
  - 'platform/packages/*'
  # Extension SDK packages
  - 'extensions/*/packages/*'
  # Theme frontends (Maven module frontend-maven-plugin builds via corepack/pnpm)
  - 'themes/*/sources/src/main/frontend'

allowBuilds:
  argon2: true
  esbuild: true
  sharp: false

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.45'
  - '@vue/compiler-dom@3.5.45'
  - '@vue/compiler-sfc@3.5.45'
  - '@vue/compiler-ssr@3.5.45'
  - '@vue/reactivity@3.5.45'
  - '@vue/runtime-core@3.5.45'
  - '@vue/runtime-dom@3.5.45'
  - '@vue/server-renderer@3.5.45'
  - '@vue/shared@3.5.45'
  - vite@8.3.6
  - vue@3.5.45
