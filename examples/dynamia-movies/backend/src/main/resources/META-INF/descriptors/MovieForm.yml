view: form
beanClass: tools.dynamia.demos.movies.domain.Movie
autofields: false

fields:
  title:
    params:
      span: 2
  year:
  runtime:
    component: quantityinput
    params:
      min: 0
      step: 5
  certification:
  language:
  country:
  studio:
  genres:
    params:
      span: 2
  rating:
    component: rating
    params:
      max: 5
      scale: 10
  votes:
  budget:
    label: Budget (M USD)
    component: moneyinput
    params:
      decimals: 1
  boxOffice:
    label: Box Office (M USD)
    component: moneyinput
    params:
      decimals: 1
  featured:
  posterUrl:
    params:
      span: 2
  trailerUrl:
    params:
      span: 2
  synopsis:
    params:
      span: 4
      multiline: true
      height: 90px

layout:
  columns: 4
