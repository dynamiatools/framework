view: form
beanClass: tools.dynamia.modules.saas.domain.AccountPaymentProvider
autofields: false

fields:
  # General
  name:
  paymentProcessor:
    label: Processor
    component: providerpickerbox
    params:
      className: tools.dynamia.modules.saas.AccountPaymentProcessor
      nameField: name
      idField: id
  providerAlias:
    label: Provider Alias
  merchantId:
  testMode:
  active:

  # Credentials
  apiKey:
  apiSecret:
  integritySecret:

  # Endpoints
  serviceURL:
    label: API Service URL
  webCheckoutURL:
  librariesURL:

  # Webhooks & events
  webCheckoutSecret:
  eventsSecret:
  webhooksSecret:

  # Extra
  extra0:
    label: Extra 0
  extra1:
    label: Extra 1
  extra2:
    label: Extra 2
  extra3:
    label: Extra 3

groups:
  credentials:
    label: Credentials
    fields: [ apiKey, apiSecret, integritySecret ]

  endpoints:
    label: Endpoints
    fields: [ serviceURL, webCheckoutURL, librariesURL ]

  webhooks:
    label: Webhooks & Events
    fields: [ webCheckoutSecret, eventsSecret, webhooksSecret ]

  extraProperties:
    label: Extra Properties
    fields: [ extra0, extra1, extra2, extra3 ]

layout:
  columns: 4
